<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas!!!!!!</title>
</head>

<body>
    <!-- Colspan - Mesclar Colunas -->
    <!-- Rowspan - Mesclar Linhas -->

    <table border="1">

        <thead>
            <tr>

                <th>Produtos</th>
                <th colspan="2">Detalhes</th>
            </tr>

        </thead>

        <tbody>
            <tr>

                <td>Notebook</td>
                <td>R$3.000,00</td>
                <TD>Em estoque</TD>

            </tr>
            <tr>

                <td rowspan="2">Celular</td>
                <td>R$2.000,00</td>
                <TD>Vendido</TD>
            </tr>
            <tr>
                <td>R$1.800,00</td>
                <TD>Em estoque</TD>






            </tr>

        </tbody>
    </table>













</body>

</html>
